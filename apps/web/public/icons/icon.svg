<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NR AI Studio">
  <!--
    Full-bleed source for the generated home-screen icons (apple-touch-icon.png,
    icon-maskable-512.png, icon-192.png, icon-512.png). Full-bleed because those
    surfaces mask the artwork themselves: iOS rounds the corners, Android crops
    to the launcher shape.

    The mark is /favicon.svg's "NR" monogram, inverted to the dark app-icon
    treatment, and held to a ~270x231px ink box. Android's maskable safe zone is
    the centre circle of 80% diameter (409.6px), and that box's diagonal is
    355px, so the monogram survives any launcher shape.

    See app/manifest.ts for the regeneration command.
  -->
  <rect width="512" height="512" fill="#111827"/>
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(13 13) scale(4.86)"
  >
    <path d="M26,70 V30 L46,70 V30"/>
    <path d="M56,70 V30 H67 A9,9 0 0 1 67,48 H56 M63,48 L74,70"/>
  </g>
</svg>
